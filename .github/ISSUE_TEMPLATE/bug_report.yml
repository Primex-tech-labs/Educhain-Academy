name: Bug report
description: Report something that is broken or behaves unexpectedly.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. Please search existing issues first.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: A clear, concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include logs, errors, or screenshots if relevant.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      description: The commit SHA, tag, or branch where you saw the bug.
    validations:
      required: false
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - contracts (Soroban/Rust)
        - SDK (TypeScript)
        - docs
        - CI / tooling
    validations:
      required: true
