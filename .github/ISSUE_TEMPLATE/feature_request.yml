name: Feature request
description: Propose a new feature or a well-scoped task.
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Use this form for new features or tasks you want to work on. Clear scope and
        acceptance criteria help contributors and maintainers move fast.
  - type: textarea
    id: why
    attributes:
      label: Why
      description: What problem does this solve? Who benefits (learners, issuers, verifiers)?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: A bullet list of what should be built. Note what is explicitly out of scope.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Checklist of conditions that must be true for this to be closed.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: Commands or checks a reviewer will run (lint, tests, build).
      placeholder: "cargo test --workspace && pnpm lint && pnpm test"
    validations:
      required: false
  - type: dropdown
    id: complexity
    attributes:
      label: Proposed complexity
      options:
        - trivial
        - medium
        - high
    validations:
      required: true
